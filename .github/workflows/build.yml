name: Build

# Manual only. Builds standalone executables with PyInstaller for Windows and
# Linux and attaches them to the workflow run as artifacts, named
# pingmonitor_v<version>_<platform>_<arch>.zip.
# It never commits, pushes, tags or publishes a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest hosted images that are still supported, so the
          # binaries run on older systems too (Windows 10+, older glibc).
          - os: windows-latest
            platform: windows
            binary: PingMonitor.exe
          - os: ubuntu-22.04
            platform: linux
            binary: PingMonitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install the project and PyInstaller
        run: python -m pip install ".[build]"

      - name: Build
        run: pyinstaller packaging/pingmonitor.spec --noconfirm --clean

      - name: Smoke test (the app must keep running)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 "./dist/${{ matrix.binary }}"
          code=$?
          set -e
          # 124 means timeout had to kill it, i.e. it started and stayed up.
          if [ "$code" -ne 124 ]; then
            echo "The executable exited early with code $code"
            exit 1
          fi

      - name: Smoke test (the app must keep running)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\${{ matrix.binary }}" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "The executable exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Package
        id: package
        shell: python
        run: |
          import os
          import platform
          import re
          import zipfile
          from pathlib import Path

          init = Path("src/pingmonitor/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          arch = {
              "amd64": "x86_64",
              "x86_64": "x86_64",
              "arm64": "arm64",
              "aarch64": "arm64",
          }.get(platform.machine().lower(), platform.machine().lower())

          name = f"pingmonitor_v{version}_${{ matrix.platform }}_{arch}"
          out = Path("out")
          out.mkdir()
          archive = out / f"{name}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              # ZipFile.write keeps the file mode, so the Linux binary stays executable.
              zf.write("dist/${{ matrix.binary }}", "${{ matrix.binary }}")
              zf.write("LICENSE", "LICENSE")
              zf.write("README.md", "README.md")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"name={name}\n")
              f.write(f"path={archive.as_posix()}\n")
          print(f"Created {archive}")

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14
